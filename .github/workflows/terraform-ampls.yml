name: "Terraform – AMPLS"

on:
  push:
    branches:
      - main
    paths:
      - "ampls/**"
      - ".github/workflows/terraform-ampls.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ampls/**"
      - ".github/workflows/terraform-ampls.yml"

permissions:
  contents: read
  pull-requests: write   # allows the plan step to post a PR comment

env:
  TF_WORKING_DIR: ampls

jobs:
  terraform:
    name: "terraform init → validate → plan"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Install Terraform
      # -----------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      # -----------------------------------------------------------------------
      # 3. Format check
      # -----------------------------------------------------------------------
      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check -recursive -diff

      # -----------------------------------------------------------------------
      # 4. Init
      # -----------------------------------------------------------------------
      - name: Terraform init
        id: init
        run: terraform init -input=false
        env:
          ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}

      # -----------------------------------------------------------------------
      # 5. Validate
      # -----------------------------------------------------------------------
      - name: Terraform validate
        id: validate
        run: terraform validate -no-color

      # -----------------------------------------------------------------------
      # 6. Plan  (always run, even on push – output posted to PR comment)
      # -----------------------------------------------------------------------
      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan
        continue-on-error: false
        env:
          ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}

      # -----------------------------------------------------------------------
      # 7. Post plan output as a PR comment (pull_request events only)
      # -----------------------------------------------------------------------
      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌 \`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️ \`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖 \`${{ steps.validate.outcome }}\`
            #### Terraform Plan 📖 \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
